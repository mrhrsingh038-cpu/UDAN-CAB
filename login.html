<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UDAN CAB - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #111,
                    #292929
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 950px;

            max-width: 100%;

            min-height: 580px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            display: flex;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.4);
        }

        /* LEFT */

        .left {
            width: 45%;

            background: #111;

            color: white;

            padding: 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .logo {
            font-size: 35px;

            font-weight: bold;

            margin-bottom: 30px;
        }

        .logo span {
            color: #ffd000;
        }

        .left h1 {
            font-size: 40px;

            margin-bottom: 20px;
        }

        .left p {
            color: #ccc;

            line-height: 1.6;

            font-size: 17px;
        }

        .cab-icon {
            font-size: 75px;

            margin-top: 40px;
        }

        /* RIGHT */

        .right {
            width: 55%;

            padding: 40px;

            position: relative;
        }

        .back {
            position: absolute;

            top: 20px;

            right: 25px;

            text-decoration: none;

            color: #555;

            font-size: 14px;
        }

        .right h2 {
            font-size: 30px;

            margin-top: 20px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 25px;
        }

        /* ROLE */

        .role-container {
            display: flex;

            gap: 12px;

            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;

            padding: 13px;

            border: 2px solid #ddd;

            background: white;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .role-btn.active {
            background: #ffd000;

            border-color: #ffd000;
        }

        /* INPUT */

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        .input-box input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .input-box input:focus {
            border-color: #111;
        }

        /* DRIVER */

        #driverFields {
            display: none;
        }

        /* BUTTON */

        .main-btn {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            background: #111;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .main-btn:hover {
            background: #333;
        }

        /* SWITCH */

        .switch {
            text-align: center;

            margin-top: 18px;

            color: #666;
        }

        .switch span {
            color: #111;

            font-weight: bold;

            cursor: pointer;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .container {
                flex-direction: column;
            }

            .left {
                width: 100%;

                padding: 30px;
            }

            .left h1 {
                font-size: 30px;
            }

            .cab-icon {
                display: none;
            }

            .right {
                width: 100%;

                padding: 30px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- LEFT -->

    <div class="left">

        <div class="logo">

            UDAN<span>CAB</span>

        </div>

        <h1>

            Your Ride.<br>
            Your Way.

        </h1>

        <p>

            Book rides, drive with us and
            experience a simple and reliable
            transportation platform.

        </p>

        <div class="cab-icon">

            🚕 🛺 🏍️

        </div>

    </div>


    <!-- RIGHT -->

    <div class="right">


        <a
            href="index.html"
            class="back">

            ← Back to Home

        </a>


        <h2 id="formTitle">

            Welcome Back!

        </h2>


        <p
            class="subtitle"
            id="formSubtitle">

            Login to continue your journey.

        </p>


        <!-- ROLE -->

        <div class="role-container">

            <button
                class="role-btn active"
                id="userRole"
                onclick="selectRole('user')">

                👤 Passenger

            </button>


            <button
                class="role-btn"
                id="driverRole"
                onclick="selectRole('driver')">

                🚕 Driver

            </button>

        </div>


        <!-- NAME -->

        <div
            class="input-box"
            id="nameField"
            style="display:none;">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name">

        </div>


        <!-- EMAIL -->

        <div class="input-box">

            <label>
                Email / Phone
            </label>

            <input
                type="text"
                id="email"
                placeholder="Enter email or phone">

        </div>


        <!-- PASSWORD -->

        <div class="input-box">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password">

        </div>


        <!-- DRIVER -->

        <div id="driverFields">


            <div class="input-box">

                <label>
                    Vehicle Number
                </label>

                <input
                    type="text"
                    id="vehicleNumber"
                    placeholder="Example: BR01AB1234">

            </div>


            <div class="input-box">

                <label>
                    Driving License
                </label>

                <input
                    type="text"
                    id="license"
                    placeholder="Enter license number">

            </div>


        </div>


        <!-- BUTTON -->

        <button
            class="main-btn"
            id="mainButton"
            onclick="submitForm()">

            Login

        </button>


        <!-- SWITCH -->

        <p
            class="switch"
            id="switchText">

            Don't have an account?

            <span onclick="toggleForm()">
                Create Account
            </span>

        </p>


    </div>

</div>



<script>


/* =========================
   VARIABLES
========================= */

let selectedRole = "user";

let isRegister = false;


/* =========================
   SELECT ROLE
========================= */

function selectRole(role) {

    selectedRole = role;

    const userRole =
        document.getElementById("userRole");

    const driverRole =
        document.getElementById("driverRole");

    const driverFields =
        document.getElementById("driverFields");

    if (role === "user") {

        userRole.classList.add("active");

        driverRole.classList.remove("active");

        driverFields.style.display =
            "none";

    }

    else {

        driverRole.classList.add("active");

        userRole.classList.remove("active");

        if (isRegister) {

            driverFields.style.display =
                "block";

        }

    }

}


/* =========================
   TOGGLE LOGIN / REGISTER
========================= */

function toggleForm() {

    isRegister =
        !isRegister;


    const title =
        document.getElementById(
            "formTitle"
        );

    const subtitle =
        document.getElementById(
            "formSubtitle"
        );

    const button =
        document.getElementById(
            "mainButton"
        );

    const switchText =
        document.getElementById(
            "switchText"
        );

    const nameField =
        document.getElementById(
            "nameField"
        );

    const driverFields =
        document.getElementById(
            "driverFields"
        );


    if (isRegister) {

        title.innerText =
            "Create Account";

        subtitle.innerText =
            "Register to start using UDAN CAB.";

        button.innerText =
            "Register";


        nameField.style.display =
            "block";


        if (selectedRole === "driver") {

            driverFields.style.display =
                "block";

        }


        switchText.innerHTML =
            'Already have an account? ' +
            '<span onclick="toggleForm()">Login</span>';

    }

    else {

        title.innerText =
            "Welcome Back!";

        subtitle.innerText =
            "Login to continue your journey.";

        button.innerText =
            "Login";


        nameField.style.display =
            "none";

        driverFields.style.display =
            "none";


        switchText.innerHTML =
            "Don't have an account? " +
            '<span onclick="toggleForm()">Create Account</span>';

    }

}


/* =========================
   SUBMIT
========================= */

async function submitForm() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value
        .trim();


    if (
        email === "" ||
        password === ""
    ) {

        alert(
            "Please fill email/phone and password."
        );

        return;

    }


    /* =========================
       REGISTER
    ========================= */

    if (isRegister) {

        const name =
            document
            .getElementById("name")
            .value
            .trim();


        if (name === "") {

            alert(
                "Please enter your name."
            );

            return;

        }


        let vehicleNumber = "";

        let license = "";


        if (
            selectedRole ===
            "driver"
        ) {

            vehicleNumber =
                document
                .getElementById(
                    "vehicleNumber"
                )
                .value
                .trim();


            license =
                document
                .getElementById(
                    "license"
                )
                .value
                .trim();


            if (
                vehicleNumber === "" ||
                license === ""
            ) {

                alert(
                    "Please enter vehicle number and driving license."
                );

                return;

            }

        }


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name:
                                name,

                            email:
                                email,

                            password:
                                password,

                            role:
                                selectedRole,

                            vehicleNumber:
                                vehicleNumber,

                            license:
                                license

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    "❌ " +
                    data.message
                );

                return;

            }


            alert(
                "🎉 Registration Successful!"
            );


            /* GO LOGIN */

            toggleForm();


            document
                .getElementById(
                    "password"
                )
                .value = "";


        }

        catch (error) {

            console.error(error);

            alert(
                "❌ Backend se connection nahi ho raha."
            );

        }

        return;

    }


    /* =========================
       LOGIN
    ========================= */

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        email:
                            email,

                        password:
                            password,

                        role:
                            selectedRole

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                data.message
            );

            return;

        }


        /* SAVE AUTH TOKEN + USER */

        localStorage.setItem(
            "udanToken",
            data.token
        );

        localStorage.setItem(
            "udanUser",
            JSON.stringify(
                data.user
            )
        );


        alert(
            "✅ Login Successful!"
        );


        /* REDIRECT */

        if (
            selectedRole ===
            "driver"
        ) {

            window.location.href =
                "driver-dashboard.html";

        }

        else {

            window.location.href =
                "dashboard.html";

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Backend se connection nahi ho raha.\n\n" +
            "Check karo server.js running hai."
        );

    }

}

</script>


</body>

</html>
