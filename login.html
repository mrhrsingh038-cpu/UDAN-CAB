<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UDAN CAB - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .container {
            min-height: 100vh;
            display: flex;
        }

        .left {
            width: 50%;
            background: #111;
            color: white;
            padding: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .logo span {
            color: #ffd000;
        }

        .left h1 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .left p {
            color: #ccc;
            font-size: 18px;
            line-height: 1.6;
            max-width: 500px;
        }

        .cab-icon {
            font-size: 70px;
            margin-top: 40px;
        }

        .right {
            width: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 10%;
        }

        .back {
            color: #111;
            text-decoration: none;
            margin-bottom: 35px;
            font-weight: bold;
        }

        h2 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .role-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .role-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #111;
        }

        #vehicleFields {
            display: none;
        }

        #nameField {
            display: none;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-btn:hover {
            background: #333;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .switch span {
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 35px;
            }

            .left h1 {
                font-size: 35px;
            }

            .right {
                padding: 35px;
            }

            .cab-icon {
                display: none;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="left">

            <div class="logo">
                UDAN<span>CAB</span>
            </div>

            <h1>
                Your Ride.<br>
                Your Way.
            </h1>

            <p>
                Book rides, drive with us and
                experience a simple and reliable
                transportation platform.
            </p>

            <div class="cab-icon">
                🚕 🛺 🏍️
            </div>

        </div>


        <div class="right">

            <a
                href="index.html"
                class="back"
            >
                ← Back to Home
            </a>

            <h2 id="formTitle">
                Welcome Back!
            </h2>

            <p
                class="subtitle"
                id="formSubtitle"
            >
                Login to continue your journey.
            </p>


            <div class="role-container">

                <button
                    class="role-btn active"
                    id="userRole"
                    onclick="selectRole('user')"
                >
                    👤 Passenger
                </button>

                <button
                    class="role-btn"
                    id="driverRole"
                    onclick="selectRole('driver')"
                >
                    🚕 Driver
                </button>

            </div>


            <div
                class="input-box"
                id="nameField"
            >

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="input-box">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

            </div>


            <div class="input-box">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

            </div>


            <div id="vehicleFields">

                <div class="input-box">

                    <label>
                        Vehicle Number
                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        placeholder="Example: BR01AB1234"
                    >

                </div>


                <div class="input-box">

                    <label>
                        Driving License
                    </label>

                    <input
                        type="text"
                        id="license"
                        placeholder="Enter license number"
                    >

                </div>

            </div>


            <button
                class="main-btn"
                onclick="submitForm()"
            >
                Login
            </button>


            <p class="switch" id="switchText">

                Don't have an account?

                <span onclick="toggleForm()">
                    Create Account
                </span>

            </p>

        </div>

    </div>


<script>

    const API =
        "https://udan-cab.onrender.com";


    let selectedRole =
        "user";

    let isRegister =
        false;


    /* =====================================================
       ROLE
    ===================================================== */

    function selectRole(role) {

        selectedRole =
            role;


        const userBtn =
            document.getElementById(
                "userRole"
            );

        const driverBtn =
            document.getElementById(
                "driverRole"
            );

        const vehicleFields =
            document.getElementById(
                "vehicleFields"
            );


        if (
            role === "user"
        ) {

            userBtn.classList.add(
                "active"
            );

            driverBtn.classList.remove(
                "active"
            );

            vehicleFields.style.display =
                "none";

        }

        else {

            driverBtn.classList.add(
                "active"
            );

            userBtn.classList.remove(
                "active"
            );

            vehicleFields.style.display =
                "block";

        }

    }


    /* =====================================================
       TOGGLE LOGIN / REGISTER
    ===================================================== */

    function toggleForm() {

        isRegister =
            !isRegister;


        const title =
            document.getElementById(
                "formTitle"
            );

        const subtitle =
            document.getElementById(
                "formSubtitle"
            );

        const button =
            document.querySelector(
                ".main-btn"
            );

        const switchText =
            document.getElementById(
                "switchText"
            );

        const nameField =
            document.getElementById(
                "nameField"
            );


        if (
            isRegister
        ) {

            title.innerText =
                "Create Account";

            subtitle.innerText =
                "Register to start using UDAN CAB.";

            button.innerText =
                "Register";

            nameField.style.display =
                "block";

            switchText.innerHTML =
                'Already have an account? ' +
                '<span onclick="toggleForm()">Login</span>';

        }

        else {

            title.innerText =
                "Welcome Back!";

            subtitle.innerText =
                "Login to continue your journey.";

            button.innerText =
                "Login";

            nameField.style.display =
                "none";

            switchText.innerHTML =
                "Don't have an account? " +
                '<span onclick="toggleForm()">Create Account</span>';

        }

    }


    /* =====================================================
       SUBMIT
    ===================================================== */

    async function submitForm() {

        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value.trim();


        if (
            !email ||
            !password
        ) {

            alert(
                "Please enter email and password."
            );

            return;

        }


        let name =
            "";

        let vehicleNumber =
            "";

        let license =
            "";


        if (
            isRegister
        ) {

            name =
                document.getElementById(
                    "name"
                ).value.trim();


            if (
                !name
            ) {

                alert(
                    "Please enter your name."
                );

                return;

            }

        }


        if (
            selectedRole ===
            "driver"
        ) {

            vehicleNumber =
                document.getElementById(
                    "vehicleNumber"
                ).value.trim();


            license =
                document.getElementById(
                    "license"
                ).value.trim();


            if (
                !vehicleNumber ||
                !license
            ) {

                alert(
                    "Please enter vehicle number and driving license."
                );

                return;

            }

        }


        const userData = {

            name:
                name,

            email:
                email,

            password:
                password,

            role:
                selectedRole,

            city:
                "Nalanda",

            vehicleNumber:
                vehicleNumber,

            vehicleType:
                "",

            license:
                license

        };


        try {

            /* =================================================
               REGISTER
            ================================================= */

            if (
                isRegister
            ) {

                const response =
                    await fetch(
                        API +
                        "/api/register",
                        {

                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    userData
                                )

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok
                ) {

                    alert(
                        "❌ " +
                        (
                            data.message ||
                            "Registration failed."
                        )
                    );

                    return;

                }


                alert(
                    "🎉 Registration Successful!\n\nNow login with your account."
                );


                toggleForm();


                return;

            }


            /* =================================================
               LOGIN
            ================================================= */

            const response =
                await fetch(
                    API +
                    "/api/login",
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                userData
                            )

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                alert(
                    "❌ " +
                    (
                        data.message ||
                        "Login failed."
                    )
                );

                return;

            }


            /* =================================================
               SAVE LOGIN
            ================================================= */

            localStorage.setItem(
                "udanToken",
                data.token
            );


            localStorage.setItem(
                "udanUser",
                JSON.stringify(
                    data.user
                )
            );


            alert(
                "✅ Login Successful!\n\nWelcome to UDAN CAB!"
            );


            /* =================================================
               IMPORTANT REDIRECT
            ================================================= */

            if (
                data.user.role ===
                "driver"
            ) {

                /*
                   Actual file in your GitHub:
                   driver-dashboard(1).html
                */

                window.location.href =
                    "/backend/driver-dashboard(1).html";

            }

            else if (
                data.user.role ===
                "admin"
            ) {

                window.location.href =
                    "/backend/admin(1).html";

            }

            else {

                /*
                   Actual file in your GitHub:
                   dashboard(1).html
                */

                window.location.href =
                    "/backend/dashboard(1).html";

            }

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "❌ Render backend se connection nahi ho pa raha."
            );

        }

    }


</script>

</body>

</html>
