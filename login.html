<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UDAN CAB - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #111,
                #252525
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 900px;
            max-width: 100%;
            min-height: 550px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow:
                0 20px 50px rgba(0,0,0,.4);
        }

        .left {
            width: 45%;
            background: #111;
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #ffd000;
        }

        .left h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .left p {
            color: #ccc;
            line-height: 1.6;
            font-size: 17px;
        }

        .cab-icon {
            font-size: 80px;
            margin-top: 40px;
        }

        .right {
            width: 55%;
            padding: 45px;
            position: relative;
        }

        .right h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .role-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .role-btn.active {
            background: #ffd000;
            border-color: #ffd000;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #111;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-btn:hover {
            background: #333;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .switch span {
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            position: absolute;
            top: 20px;
            right: 25px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .back:hover {
            color: #111;
        }

        #vehicleFields {
            display: none;
        }

        #nameField {
            display: none;
        }

        @media(max-width:700px) {

            .container {
                flex-direction: column;
            }

            .left {
                width: 100%;
                padding: 30px;
            }

            .left h1 {
                font-size: 30px;
            }

            .cab-icon {
                display: none;
            }

            .right {
                width: 100%;
                padding: 30px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LEFT SIDE -->

        <div class="left">

            <div class="logo">
                UDAN<span>CAB</span>
            </div>

            <h1>
                Your Ride.<br>
                Your Way.
            </h1>

            <p>
                Book rides, drive with us and
                experience a simple and reliable
                transportation platform.
            </p>

            <div class="cab-icon">
                🚕 🛺 🏍️
            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right">


            <a
                href="/index.html"
                class="back"
            >
                ← Back to Home
            </a>


            <h2 id="formTitle">
                Welcome Back!
            </h2>


            <p
                class="subtitle"
                id="formSubtitle"
            >
                Login to continue your journey.
            </p>


            <!-- ROLE -->

            <div class="role-container">


                <button
                    class="role-btn active"
                    id="userRole"
                    onclick="selectRole('user')"
                >
                    👤 Passenger
                </button>


                <button
                    class="role-btn"
                    id="driverRole"
                    onclick="selectRole('driver')"
                >
                    🚕 Driver
                </button>


            </div>


            <!-- NAME -->

            <div
                class="input-box"
                id="nameField"
            >

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

            </div>


            <!-- DRIVER -->

            <div id="vehicleFields">


                <div class="input-box">

                    <label>
                        Vehicle Number
                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        placeholder="Example: BR01AB1234"
                    >

                </div>


                <div class="input-box">

                    <label>
                        Driving License
                    </label>

                    <input
                        type="text"
                        id="license"
                        placeholder="Enter license number"
                    >

                </div>


            </div>


            <!-- BUTTON -->

            <button
                class="main-btn"
                onclick="submitForm()"
            >
                Login
            </button>


            <!-- SWITCH -->

            <p
                class="switch"
                id="switchText"
            >

                Don't have an account?

                <span onclick="toggleForm()">
                    Create Account
                </span>

            </p>


        </div>

    </div>


<script>


    /* =====================================================
       RENDER BACKEND
    ===================================================== */

    const API =
        "https://udan-cab.onrender.com";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let selectedRole =
        "user";

    let isRegister =
        false;


    /* =====================================================
       SELECT ROLE
    ===================================================== */

    function selectRole(role) {

        selectedRole =
            role;


        const userButton =
            document.getElementById(
                "userRole"
            );


        const driverButton =
            document.getElementById(
                "driverRole"
            );


        const vehicleFields =
            document.getElementById(
                "vehicleFields"
            );


        if (
            role === "user"
        ) {

            userButton.classList.add(
                "active"
            );


            driverButton.classList.remove(
                "active"
            );


            vehicleFields.style.display =
                "none";


        }

        else {

            driverButton.classList.add(
                "active"
            );


            userButton.classList.remove(
                "active"
            );


            vehicleFields.style.display =
                "block";

        }

    }


    /* =====================================================
       LOGIN / REGISTER TOGGLE
    ===================================================== */

    function toggleForm() {

        isRegister =
            !isRegister;


        const title =
            document.getElementById(
                "formTitle"
            );


        const subtitle =
            document.getElementById(
                "formSubtitle"
            );


        const button =
            document.querySelector(
                ".main-btn"
            );


        const switchText =
            document.getElementById(
                "switchText"
            );


        const nameField =
            document.getElementById(
                "nameField"
            );


        if (
            isRegister
        ) {

            title.innerText =
                "Create Account";


            subtitle.innerText =
                "Register to start using UDAN CAB.";


            button.innerText =
                "Register";


            nameField.style.display =
                "block";


            switchText.innerHTML =
                'Already have an account? ' +
                '<span onclick="toggleForm()">Login</span>';


        }

        else {

            title.innerText =
                "Welcome Back!";


            subtitle.innerText =
                "Login to continue your journey.";


            button.innerText =
                "Login";


            nameField.style.display =
                "none";


            switchText.innerHTML =
                "Don't have an account? " +
                '<span onclick="toggleForm()">Create Account</span>';

        }

    }


    /* =====================================================
       SUBMIT FORM
    ===================================================== */

    async function submitForm() {


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value
                .trim();


        if (
            email === "" ||
            password === ""
        ) {

            alert(
                "Please fill all required fields."
            );

            return;

        }


        let name =
            "";


        let vehicleNumber =
            "";


        let license =
            "";


        /* =================================================
           REGISTER NAME
        ================================================= */

        if (
            isRegister
        ) {

            name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            if (
                name === ""
            ) {

                alert(
                    "Please enter your name."
                );

                return;

            }

        }


        /* =================================================
           DRIVER DETAILS
        ================================================= */

        if (
            selectedRole ===
            "driver"
        ) {

            vehicleNumber =
                document
                    .getElementById(
                        "vehicleNumber"
                    )
                    .value
                    .trim();


            license =
                document
                    .getElementById(
                        "license"
                    )
                    .value
                    .trim();


            if (
                vehicleNumber === "" ||
                license === ""
            ) {

                alert(
                    "Please enter vehicle number and driving license."
                );

                return;

            }

        }


        /* =================================================
           USER DATA
        ================================================= */

        const userData = {

            name:
                name,

            email:
                email,

            password:
                password,

            role:
                selectedRole,

            city:
                "Nalanda",

            vehicleNumber:
                vehicleNumber,

            vehicleType:
                "",

            license:
                license

        };


        try {


            /* =============================================
               REGISTER
            ============================================= */

            if (
                isRegister
            ) {


                const response =
                    await fetch(
                        API +
                        "/api/register",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    userData
                                )

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok
                ) {

                    alert(
                        "❌ " +
                        (
                            data.message ||
                            "Registration failed."
                        )
                    );

                    return;

                }


                alert(
                    "🎉 Registration Successful!\n\n" +
                    "Now login with your account."
                );


                toggleForm();


                document
                    .getElementById(
                        "password"
                    )
                    .value =
                    "";


                return;

            }


            /* =============================================
               LOGIN
            ============================================= */

            const response =
                await fetch(
                    API +
                    "/api/login",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                userData
                            )

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                alert(
                    "❌ " +
                    (
                        data.message ||
                        "Login failed."
                    )
                );

                return;

            }


            /* =============================================
               SAVE TOKEN
            ============================================= */

            localStorage.setItem(
                "udanToken",
                data.token
            );


            localStorage.setItem(
                "udanUser",
                JSON.stringify(
                    data.user
                )
            );


            console.log(
                "Logged in user:",
                data.user
            );


            alert(
                "✅ Login Successful!\n\n" +
                "Welcome to UDAN CAB!"
            );


            /* =============================================
               REDIRECT
            ============================================= */

            const role =
                data.user.role;


            if (
                role ===
                "driver"
            ) {

                /*
                   File actually exists in ROOT:
                   driver-dashboard(1).html
                */

                window.location.href =
                    "/driver-dashboard(1).html";


            }

            else if (
                role ===
                "admin"
            ) {

                /*
                   File actually exists in ROOT:
                   admin(1).html
                */

                window.location.href =
                    "/admin(1).html";


            }

            else {

                /*
                   File actually exists in ROOT:
                   dashboard(1).html
                */

                window.location.href =
                    "/dashboard(1).html";

            }


        }

        catch (
            error
        ) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            alert(
                "❌ Render backend se connection nahi ho pa raha.\n\n" +
                "Please try again."
            );

        }

    }


    /* =====================================================
       DEFAULT ROLE
    ===================================================== */

    selectRole(
        "user"
    );


</script>


</body>

</html>
