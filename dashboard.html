<!-- =========================================
     UDAN CAB - PASSENGER LIVE RIDE TRACKING
========================================= -->

<style>

#passengerLiveBox {

    display: none;

    background: white;

    padding: 25px;

    margin: 30px 0;

    border-radius: 15px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.10);

}

#passengerLiveMap {

    width: 100%;

    height: 420px;

    border-radius: 12px;

    margin-top: 20px;

}

.live-info-grid {

    display: flex;

    gap: 15px;

    flex-wrap: wrap;

    margin-top: 15px;

}

.live-info-card {

    flex: 1;

    min-width: 220px;

    padding: 15px;

    background: #f5f5f5;

    border-radius: 10px;

}

.live-info-card p {

    margin-top: 8px;

    color: #555;

    word-break: break-word;

}

.live-status {

    margin-top: 15px;

    padding: 13px;

    border-radius: 8px;

    background: #e9f8ee;

    color: #16803c;

    font-weight: bold;

}

.driver-found {

    margin-top: 15px;

    padding: 15px;

    background: #fff8d6;

    border-radius: 10px;

}

</style>


<!-- =========================================
     LIVE TRACKING UI
========================================= -->

<div id="passengerLiveBox">

    <h2>
        🚕 Live Ride Tracking
    </h2>


    <div class="live-info-grid">


        <div class="live-info-card">

            <b>
                📍 Your Location
            </b>

            <p id="passengerOwnLocation">
                Waiting for GPS...
            </p>

        </div>


        <div class="live-info-card">

            <b>
                🚕 Driver Location
            </b>

            <p id="passengerDriverLocation">
                Waiting for driver...
            </p>

        </div>


        <div class="live-info-card">

            <b>
                🚕 Ride Status
            </b>

            <p id="passengerRideStatus">
                Waiting...
            </p>

        </div>

    </div>


    <div
        class="driver-found"
        id="passengerDriverInfo">

        🔎 Waiting for driver assignment...

    </div>


    <div
        class="live-status"
        id="passengerLiveStatus">

        🟡 Starting live tracking...

    </div>


    <div id="passengerLiveMap"></div>

</div>


<script>

/* =========================================
   PASSENGER LIVE TRACKING
========================================= */

const PASSENGER_API = "";

const PASSENGER_TOKEN =
    localStorage.getItem("udanToken");


const PASSENGER_USER =
    JSON.parse(
        localStorage.getItem(
            "udanUser"
        ) || "null"
    );


let PASSENGER_RIDE_ID =
    localStorage.getItem(
        "udanCurrentRide"
    );


/* MAP */

let passengerLiveMap = null;

let passengerOwnMarker = null;

let passengerDriverMarker = null;


/* TIMERS */

let passengerRideTimer = null;

let passengerGpsWatch = null;


/* =========================================
   CREATE MAP
========================================= */

function createPassengerLiveMap(
    lat,
    lng
) {

    if (passengerLiveMap) {

        return;

    }


    passengerLiveMap =
        L.map(
            "passengerLiveMap"
        ).setView(
            [lat, lng],
            14
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap"

        }

    ).addTo(
        passengerLiveMap
    );

}


/* =========================================
   PASSENGER MARKER
========================================= */

function updatePassengerOwnMarker(
    lat,
    lng
) {

    if (!passengerLiveMap) {

        createPassengerLiveMap(
            lat,
            lng
        );

    }


    if (!passengerOwnMarker) {

        passengerOwnMarker =
            L.marker(
                [lat, lng]
            )
            .addTo(
                passengerLiveMap
            )
            .bindPopup(
                "📍 You"
            );

    }

    else {

        passengerOwnMarker
            .setLatLng(
                [lat, lng]
            );

    }


    document
        .getElementById(
            "passengerOwnLocation"
        )
        .innerText =

        lat.toFixed(5) +
        ", " +
        lng.toFixed(5);

}


/* =========================================
   DRIVER MARKER
========================================= */

function updatePassengerDriverMarker(
    lat,
    lng
) {

    if (!passengerLiveMap) {

        createPassengerLiveMap(
            lat,
            lng
        );

    }


    if (!passengerDriverMarker) {

        passengerDriverMarker =
            L.marker(
                [lat, lng]
            )
            .addTo(
                passengerLiveMap
            )
            .bindPopup(
                "🚕 Driver - LIVE"
            );

    }

    else {

        passengerDriverMarker
            .setLatLng(
                [lat, lng]
            );

    }


    document
        .getElementById(
            "passengerDriverLocation"
        )
        .innerText =

        lat.toFixed(5) +
        ", " +
        lng.toFixed(5);


    fitPassengerLiveMap();

}


/* =========================================
   FIT BOTH MARKERS
========================================= */

function fitPassengerLiveMap() {

    if (

        !passengerLiveMap ||

        !passengerOwnMarker ||

        !passengerDriverMarker

    ) {

        return;

    }


    const group =
        L.featureGroup([

            passengerOwnMarker,

            passengerDriverMarker

        ]);


    passengerLiveMap.fitBounds(

        group
            .getBounds()
            .pad(.25)

    );

}


/* =========================================
   SEND PASSENGER LOCATION
========================================= */

function sendPassengerLiveLocation() {

    if (

        !PASSENGER_TOKEN ||

        !PASSENGER_RIDE_ID

    ) {

        return;

    }


    if (
        !navigator.geolocation
    ) {

        return;

    }


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const lat =
                position.coords.latitude;


            const lng =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            /* SHOW PASSENGER LOCATION */

            updatePassengerOwnMarker(
                lat,
                lng
            );


            /* SEND TO BACKEND */

            try {

                const response =
                    await fetch(

                        PASSENGER_API +
                        "/api/rides/" +
                        PASSENGER_RIDE_ID +
                        "/passenger-location",

                        {

                            method:
                                "PATCH",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    PASSENGER_TOKEN

                            },

                            body:
                                JSON.stringify({

                                    latitude:
                                        lat,

                                    longitude:
                                        lng,

                                    accuracy:
                                        accuracy

                                })

                        }

                    );


                if (!response.ok) {

                    const data =
                        await response
                            .json()
                            .catch(
                                () => ({})
                            );


                    console.log(
                        "Passenger location:",
                        data.message
                    );

                }

            }

            catch(error) {

                console.error(
                    "Passenger GPS error:",
                    error
                );

            }

        },


        function(error) {

            console.log(
                "Passenger GPS:",
                error.message
            );

        },


        {

            enableHighAccuracy:
                true,

            maximumAge:
                3000,

            timeout:
                10000

        }

    );

}


/* =========================================
   LOAD RIDE + DRIVER LOCATION
========================================= */

async function loadPassengerLiveRide() {

    if (

        !PASSENGER_TOKEN ||

        !PASSENGER_RIDE_ID

    ) {

        return;

    }


    try {

        const response =
            await fetch(

                PASSENGER_API +
                "/api/rides/" +
                PASSENGER_RIDE_ID,

                {

                    headers: {

                        "Authorization":
                            "Bearer " +
                            PASSENGER_TOKEN

                    }

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            console.log(
                "Ride tracking:",
                data.message
            );

            return;

        }


        const ride =
            data.ride;


        if (!ride) {

            return;

        }


        /* =================================
           RIDE STATUS
        ================================= */

        document
            .getElementById(
                "passengerRideStatus"
            )
            .innerText =
            ride.status ||
            "Processing";


        /* =================================
           DRIVER INFORMATION
        ================================= */

        if (
            ride.driverId
        ) {

            const driver =
                ride.driverId;


            document
                .getElementById(
                    "passengerDriverInfo"
                )
                .innerHTML =

                "🚕 <b>Driver Assigned</b><br>" +

                "Name: " +
                escapePassengerLive(
                    driver.name ||
                    "Driver"
                ) +

                "<br>" +

                "Vehicle: " +
                escapePassengerLive(
                    driver.vehicleType ||
                    "-"
                ) +

                "<br>" +

                "Vehicle No: " +
                escapePassengerLive(
                    driver.vehicleNumber ||
                    "-"
                );

        }

        else {

            document
                .getElementById(
                    "passengerDriverInfo"
                )
                .innerText =
                "🔎 Searching for nearest driver...";

        }


        /* =================================
           DRIVER LOCATION
        ================================= */

        if (
            ride.driverLocation
        ) {

            const lat =
                Number(
                    ride.driverLocation.lat
                );


            const lng =
                Number(
                    ride.driverLocation.lng
                );


            if (

                Number.isFinite(lat) &&

                Number.isFinite(lng)

            ) {

                updatePassengerDriverMarker(
                    lat,
                    lng
                );


                document
                    .getElementById(
                        "passengerLiveStatus"
                    )
                    .innerText =
                    "🟢 Driver Live Location Active";

            }

        }

        else {

            document
                .getElementById(
                    "passengerLiveStatus"
                )
                .innerText =
                "🟡 Waiting for driver's GPS...";

        }


        /* =================================
           PASSENGER LOCATION
        ================================= */

        if (
            ride.passengerLocation
        ) {

            const lat =
                Number(
                    ride.passengerLocation.lat
                );


            const lng =
                Number(
                    ride.passengerLocation.lng
                );


            if (

                Number.isFinite(lat) &&

                Number.isFinite(lng)

            ) {

                updatePassengerOwnMarker(
                    lat,
                    lng
                );

            }

        }


        /* =================================
           STOP AFTER COMPLETION
        ================================= */

        if (

            ride.status ===
                "Completed" ||

            ride.status ===
                "Cancelled"

        ) {

            stopPassengerLiveTracking();

        }

    }

    catch(error) {

        console.error(
            "Passenger live ride error:",
            error
        );

    }

}


/* =========================================
   START PASSENGER LIVE TRACKING
========================================= */

function startPassengerLiveTracking() {

    if (

        !PASSENGER_TOKEN ||

        !PASSENGER_RIDE_ID

    ) {

        return;

    }


    document
        .getElementById(
            "passengerLiveBox"
        )
        .style.display =
        "block";


    /* FIRST LOAD */

    loadPassengerLiveRide();


    sendPassengerLiveLocation();


    /* PREVENT DUPLICATE TIMER */

    if (
        passengerRideTimer
    ) {

        clearInterval(
            passengerRideTimer
        );

    }


    passengerRideTimer =
        setInterval(

            loadPassengerLiveRide,

            3000

        );


    /* GPS */

    if (
        passengerGpsWatch === null
    ) {

        if (
            navigator.geolocation
        ) {

            passengerGpsWatch =
                navigator.geolocation.watchPosition(

                    function(position) {

                        const lat =
                            position.coords.latitude;

                        const lng =
                            position.coords.longitude;


                        updatePassengerOwnMarker(
                            lat,
                            lng
                        );


                        sendPassengerLiveLocation();

                    },


                    function(error) {

                        console.log(
                            "Passenger GPS:",
                            error.message
                        );

                    },


                    {

                        enableHighAccuracy:
                            true,

                        maximumAge:
                            3000,

                        timeout:
                            10000

                    }

                );

        }

    }


    /* MAP SIZE FIX */

    setTimeout(

        function() {

            if (
                passengerLiveMap
            ) {

                passengerLiveMap
                    .invalidateSize();

            }

        },

        500

    );

}


/* =========================================
   STOP TRACKING
========================================= */

function stopPassengerLiveTracking() {

    if (
        passengerRideTimer
    ) {

        clearInterval(
            passengerRideTimer
        );

        passengerRideTimer =
            null;

    }


    if (
        passengerGpsWatch !== null
    ) {

        navigator.geolocation.clearWatch(
            passengerGpsWatch
        );

        passengerGpsWatch =
            null;

    }


    document
        .getElementById(
            "passengerLiveStatus"
        )
        .innerText =
        "⚪ Live ride tracking stopped.";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapePassengerLive(
    value
) {

    return String(
        value ?? ""
    ).replace(

        /[&<>"']/g,

        function(char) {

            return {

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#39;"

            }[char];

        }

    );

}


/* =========================================
   START
========================================= */

startPassengerLiveTracking();

</script>
