<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UDAN CAB - Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            color: #111;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: #111;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ffd000;
        }

        .driver-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #ffd000;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        /* MAIN */

        .main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh-btn {
            padding: 11px 18px;

            border: none;
            border-radius: 8px;

            background: #111;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        /* RIDES */

        .rides {
            display: grid;
            gap: 20px;
        }

        .ride-card {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.08);
        }

        .ride-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .ride-id {
            font-size: 19px;
            font-weight: bold;
        }

        .status {
            padding: 7px 13px;

            border-radius: 20px;

            background: #fff4bd;

            font-size: 13px;
            font-weight: bold;
        }

        .location {
            margin: 12px 0;

            font-size: 16px;

            line-height: 1.5;
        }

        .fare {
            margin: 20px 0;

            font-size: 24px;
            font-weight: bold;
        }

        /* BUTTONS */

        .action-btn {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;
            border-radius: 8px;

            background: #111;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .action-btn:hover {
            background: #333;
        }

        .start-btn {
            background: #16803c;
        }

        .start-btn:hover {
            background: #11652f;
        }

        .complete-btn {
            background: #0066cc;
        }

        .complete-btn:hover {
            background: #0052a3;
        }

        .disabled-btn {
            background: #888;
            cursor: not-allowed;
        }

        /* EMPTY */

        .empty {
            background: white;

            padding: 45px 20px;

            text-align: center;

            border-radius: 15px;

            color: #777;

            box-shadow:
                0 8px 25px rgba(0,0,0,.05);
        }

        /* MOBILE */

        @media(max-width:700px) {

            .navbar {
                padding: 0 20px;
            }

            .driver-info span {
                display: none;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .refresh-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            UDAN<span>CAB</span>
        </div>

        <div class="driver-info">

            <span>
                🚕 Driver
            </span>

            <button
                class="logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>



    <!-- MAIN -->

    <div class="main">


        <div class="welcome">

            <h1>
                Driver Dashboard 🚕
            </h1>

            <p>
                Find and manage passenger rides.
            </p>

        </div>



        <div class="top-bar">

            <h2>
                Available Rides
            </h2>

            <button
                class="refresh-btn"
                onclick="loadRides()">

                🔄 Refresh

            </button>

        </div>



        <!-- RIDES -->

        <div
            class="rides"
            id="rides">

        </div>


        <div id="passengerMapWrap" style="display:none;margin-top:20px;background:white;padding:20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.08);">
            <h3 style="margin-bottom:10px;">📍 Passenger Live Location</h3>
            <p id="passengerLocationText" style="color:#666;margin-bottom:12px;">Waiting for passenger location...</p>
            <div id="passengerMap" style="width:100%;height:360px;border-radius:12px;"></div>
        </div>
    </div>



    <script>
const API="";
const TOKEN=localStorage.getItem("udanToken");
const USER=JSON.parse(localStorage.getItem("udanUser")||"null");
if(!TOKEN||!USER||USER.role!=="driver"){alert("Please login as driver first.");location.href="login.html";}
const AUTH={"Content-Type":"application/json","Authorization":"Bearer "+TOKEN};
let activeRide=null;
let gpsWatch=null;
let passengerMap=null;
let passengerMarker=null;
let driverMarker=null;
let rideLocationTimer=null;

async function api(url,options={}){
  options.headers={...(options.headers||{}),Authorization:"Bearer "+TOKEN};
  if(options.body&&!options.headers["Content-Type"])options.headers["Content-Type"]="application/json";
  const r=await fetch(API+url,options);
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||"Request failed");
  return d;
}

function logout(){stopPassengerLocationPolling();localStorage.removeItem("udanToken");localStorage.removeItem("udanUser");localStorage.removeItem("udanCurrentRide");location.href="login.html";}

async function setOnline(){
 try{await api("/api/driver/status",{method:"POST",headers:AUTH,body:JSON.stringify({online:true})});}catch(e){console.error(e)}
}

function startGPS(){
 if(!navigator.geolocation)return;
 if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);
 gpsWatch=navigator.geolocation.watchPosition(async p=>{
   try{await api("/api/location/update",{method:"POST",headers:AUTH,body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})});
   if(activeRide)await api("/api/rides/"+activeRide+"/driver-location",{method:"PATCH",headers:AUTH,body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})});
   }catch(e){console.error("GPS",e)}
 },e=>console.log("GPS",e.message),{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}


async function updatePassengerLocationMap(){
 if(!activeRide) return;
 try{
  const d=await api("/api/rides/"+activeRide);
  const ride=d.ride;
  const p=ride && ride.passengerLocation;
  const dl=ride && ride.driverLocation;

  if(!p || !Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lng))){
   document.getElementById("passengerMapWrap").style.display="block";
   document.getElementById("passengerLocationText").innerText="⏳ Waiting for passenger GPS location...";
   return;
  }

  document.getElementById("passengerMapWrap").style.display="block";
  document.getElementById("passengerLocationText").innerText=
    "Passenger: "+Number(p.lat).toFixed(6)+", "+Number(p.lng).toFixed(6);

  if(!passengerMap){
   passengerMap=L.map("passengerMap");
   L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"&copy; OpenStreetMap contributors"
   }).addTo(passengerMap);
  }

  if(passengerMarker) passengerMap.removeLayer(passengerMarker);
  passengerMarker=L.marker([Number(p.lat),Number(p.lng)])
    .addTo(passengerMap)
    .bindPopup("📍 Passenger location")
    .openPopup();

  const points=[[Number(p.lat),Number(p.lng)]];

  if(dl && Number.isFinite(Number(dl.lat)) && Number.isFinite(Number(dl.lng))){
   if(driverMarker) passengerMap.removeLayer(driverMarker);
   driverMarker=L.marker([Number(dl.lat),Number(dl.lng)])
    .addTo(passengerMap)
    .bindPopup("🚕 Your location");
   points.push([Number(dl.lat),Number(dl.lng)]);
  }

  passengerMap.fitBounds(points,{padding:[40,40],maxZoom:16});
 }catch(e){
  console.log("Passenger location error:",e.message);
 }
}

function startPassengerLocationPolling(){
 if(rideLocationTimer) clearInterval(rideLocationTimer);
 updatePassengerLocationMap();
 rideLocationTimer=setInterval(updatePassengerLocationMap,3000);
}

function stopPassengerLocationPolling(){
 if(rideLocationTimer) clearInterval(rideLocationTimer);
 rideLocationTimer=null;
 activeRide=null;
 document.getElementById("passengerMapWrap").style.display="none";
}

async function loadRides(){
 const box=document.getElementById("rides");box.innerHTML='<div class="empty">⏳ Loading rides...</div>';
 try{
   const d=await api("/api/driver/rides");
   const rides=d.rides||[];
   if(!rides.length){box.innerHTML='<div class="empty">🚕 No rides available right now.<br><br>Click Refresh to check again.</div>';return;}
   box.innerHTML="";
   rides.forEach(ride=>{
     const id=ride._id; const card=document.createElement("div");card.className="ride-card";
     card.innerHTML=`<div class="ride-header"><div class="ride-id">🚕 Ride #${id.slice(-6)}</div><div class="status">${ride.status}</div></div>
     <div class="location">📍 <strong>Pickup:</strong> ${escapeHtml(ride.pickup)}</div>
     <div class="location">🎯 <strong>Destination:</strong> ${escapeHtml(ride.destination)}</div>
     <div class="location">🚗 <strong>Vehicle:</strong> ${escapeHtml(ride.cabType||ride.vehicleType||"-")}</div>
     <div class="fare">💰 ₹${Number(ride.fare||0)}</div>
     <button class="action-btn" onclick="acceptRide('${id}')">✅ Accept Ride</button>`;
     box.appendChild(card);
   });
 }catch(e){box.innerHTML='<div class="empty">❌ '+escapeHtml(e.message)+'</div>';if(e.message.toLowerCase().includes("token"))logout();}
}

async function acceptRide(id){
 try{const d=await api("/api/rides/"+id+"/accept",{method:"POST",headers:AUTH});activeRide=d.ride._id;renderActive(d.ride);startGPS();startPassengerLocationPolling();alert("🎉 Ride Accepted!");}
 catch(e){alert("❌ "+e.message);loadRides();}
}

function renderActive(ride){
 const box=document.getElementById("rides");let action="";
 if(ride.status==="Driver assigned")action=`<button class="action-btn start-btn" onclick="startRide('${ride._id}')">🚕 Start Ride</button>`;
 if(ride.status==="Ride started")action=`<button class="action-btn complete-btn" onclick="completeRide('${ride._id}')">🎉 Complete Ride</button>`;
 box.innerHTML=`<div class="ride-card"><div class="ride-header"><div class="ride-id">🚕 Ride #${ride._id.slice(-6)}</div><div class="status">${escapeHtml(ride.status)}</div></div><div class="location">📍 <strong>Pickup:</strong> ${escapeHtml(ride.pickup)}</div><div class="location">🎯 <strong>Destination:</strong> ${escapeHtml(ride.destination)}</div><div class="location">🚗 <strong>Vehicle:</strong> ${escapeHtml(ride.cabType||"-")}</div><div class="fare">💰 ₹${Number(ride.fare||0)}</div>${action}</div>`;
}
async function startRide(id){
  const code=prompt("🔐 Passenger se 4-digit Ride Start Code poochhiye:");
  if(code===null)return;
  const cleanCode=String(code).trim();
  if(!/^\d{4}$/.test(cleanCode)){alert("❌ Start code exactly 4 digits ka hona chahiye.");return;}
  try{
    const d=await api("/api/rides/"+id+"/start",{method:"PATCH",headers:AUTH,body:JSON.stringify({startCode:cleanCode})});
    activeRide=id; renderActive(d.ride); startGPS();
    alert("✅ Start Code Verified!\n\n🚕 Ride Started Successfully!");
  }catch(e){alert("❌ "+e.message);}
}
async function completeRide(id){try{const d=await api("/api/rides/"+id+"/complete",{method:"PATCH",headers:AUTH});stopPassengerLocationPolling();alert("🎉 Ride Completed Successfully!");loadRides()}catch(e){alert("❌ "+e.message)}}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
async function restoreActiveRide(){
  const savedRide=localStorage.getItem("udanCurrentRide");
  if(!savedRide)return false;
  try{
    const d=await api("/api/rides/"+savedRide);
    if(d.ride && d.ride.driverId){
      activeRide=d.ride._id;
      renderActive(d.ride);
      startPassengerLocationPolling();
      return true;
    }
  }catch(e){console.log("No active ride to restore",e.message);}
  localStorage.removeItem("udanCurrentRide");
  return false;
}

setOnline();
startGPS();
restoreActiveRide().then(found=>{if(!found)loadRides();});
setInterval(()=>{if(!activeRide)loadRides();},5000);
</script>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>

</html>
